<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eligibility Check</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 30px;
      font-size: 28px;
      line-height: 1.3;
      font-weight: 700;
    }

    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-bottom: 25px;
    }

    button {
      flex: 1;
      max-width: 180px;
      padding: 15px 25px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .yes-btn {
      background: #16a34a;
      color: white;
    }

    .no-btn {
      background: #dc2626;
      color: white;
    }

    .notice {
      margin: 0;
      font-size: 13px;
      line-height: 1.6;
      color: #6b7280;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 23px;
      }

      .buttons {
        flex-direction: column;
        align-items: center;
      }

      button {
        width: 100%;
        max-width: none;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>
      This offer is only available to people who live in the USA.<br>
      Do you live in the USA?
    </h1>

    <div class="buttons">
      <button class="yes-btn" onclick="handleYes()">YES</button>
      <button class="no-btn" onclick="handleNo()">NO</button>
    </div>

    <p class="notice">
      Even if you are not a citizen of the USA, you may qualify for this offer
      if you live in the USA.
    </p>

  </div>

  <script>
    function handleYes() {
      // Add your destination URL here
      window.location.href = "YOUR-YES-URL-HERE";
    }

    function handleNo() {
      // Add your destination URL here
      window.location.href = "YOUR-NO-URL-HERE";
    }
  </script>

</body>
</html>
